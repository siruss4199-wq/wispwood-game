float sdBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}

float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdSph(vec3 p,float r){return length(p)-r;}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.)/max(k1,1e-4);}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}

mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdArc(vec3 p,float r,float th,float a0,float a1){float a=atan(p.y,p.x);a=clamp(a,a0,a1);vec3 c=vec3(r*cos(a),r*sin(a),0.);return length(p-c)-th;}
vec2 U(vec2 a,float d,float m){return d<a.x?vec2(d,m):a;}

  vec3 q=p-vec3(0,-.3,0);r=U(r,max(sdCyl(q,.4,.27,.05),-sdCyl(q-vec3(0,.12,0),.33,.3,0.)),21.);

vec3 nor(vec3 p){vec2 e=vec2(.0012,0);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.025*float(i);o+=(h-map(p+n*h).x)*s;s*=.7;}return clamp(1.-3.*o,0.,1.);}
float shadow(vec3 ro,vec3 rd){float r=1.,t=.02;for(int i=0;i<48;i++){float h=map(ro+rd*t).x;if(h<.001)return 0.;r=min(r,8.*h/t);t+=clamp(h,.01,.2);if(t>4.)break;}return clamp(r,0.,1.);}

 if(m<1.5)return vec3(.78,.52,.28)*(1.-.08*sin(p.y*50.+sin(p.x*9.)*3.));

 if(m<3.5)return vec3(.05,.6,.6);
 if(m<4.5)return vec3(.86,.56,.14);
 if(m<5.5)return vec3(.86,.66,.36)*(1.-.2*step(.5,fract((p.x+p.y+p.z)*16.)));
 if(m<6.5){float a=atan(p.z,p.x),rr=length(p.xz);float petal=smoothstep(.06,.0,abs(sin(a*2.5))*rr-.02)*step(.1,rr)*step(rr,.3);return mix(vec3(.93,.82,.6),vec3(.72,.58,.38),petal);}
 if(m<7.5){float a=atan(p.x,p.y+.5);return mix(vec3(1.,.7,.5),vec3(.95,.48,.35),.5+.5*sin(a*15.))*(1.+.08*sin(p.y*30.));}
 if(m<8.5)return vec3(.38,.42,.5)*(1.+.12*sin(length(p.xz)*40.));
 if(m<9.5)return vec3(.97,.95,.92);
 if(m<10.5){vec2 q=p.xy-vec2(0,-.1);float a=atan(q.y,q.x),r=length(q);float s=step(.5,fract(a/(2.*PI)*6.+log(r+.01)*2.2));return mix(vec3(.97,.9,.78),vec3(.7,.38,.2),s*smoothstep(.1,.35,r));}
 if(m<11.5)return vec3(.98,.36,.32);
 if(m<12.5)return vec3(.98,.93,.8);
 if(m<13.5)return vec3(1.,.75,.25);
 if(m<14.5)return vec3(1.,.8,.4);
 if(m<15.5){float h=step(.72,fract(p.y*14.))*step(.72,fract(atan(p.z,p.x)*3.));return mix(vec3(.72,.74,.76),vec3(1.,.7,.2),h);}
 if(m<16.5)return vec3(.85,.18,.15);
 if(m<17.5){float br=step(.92,fract(p.y*7.))+step(.94,fract(atan(p.z,p.x)*2.+floor(p.y*7.)*.5));return vec3(.72,.66,.6)*(1.-.25*min(br,1.));}
 if(m<18.5)return vec3(.48,.3,.17)*(1.-.08*sin(p.x*60.));
 if(m<19.5)return vec3(.95,.55,.2);
 if(m<20.5){float g=step(.8,fract(p.x*13.))+step(.8,fract(p.z*13.+p.y*4.));return mix(vec3(.55,.62,.6),vec3(.86,.78,.55),min(g,1.));}
 if(m<21.5){float w=step(.5,fract(p.y*9.))*step(.5,fract(atan(p.z,p.x)*4.))+step(.5,fract(p.y*9.+.5))*step(.5,fract(atan(p.z,p.x)*4.+.5));return vec3(.85,.6,.27)*(.82+.25*w);}
 if(m<22.5)return vec3(.62,.9,.92);

}
void main(){

 bool metal=m>1.5&&m<2.5||m>3.5&&m<4.5||m>14.5&&m<15.5;bool gloss=metal||m>2.5&&m<3.5||m>8.5&&m<9.5||m>15.5&&m<16.5||m>21.5&&m<23.5||m>6.5&&m<7.5;
 float dif=clamp(dot(n,L),0.,1.)*shadow(p+n*.003,L);

 vec3 lin=vec3(1.05,.97,.88)*dif*1.15+vec3(.45,.55,.7)*sky*.42*occ+vec3(.6,.45,.3)*bounce*.18*occ;
 if(metal)lin=lin*.85+vec3(.16)*sky*occ;

 col+=rim*vec3(.55,.75,.95)*.22*occ*clamp(dot(n,normalize(vec3(.7,.3,-.5)))+.4,0.,1.);
 col*=mix(1.,.62,pow(rim,1.6));
