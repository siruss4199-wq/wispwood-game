}
vec3 nor(vec3 p){vec2 e=vec2(.0012,0);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.025*float(i);o+=(h-map(p+n*h).x)*s;s*=.7;}return clamp(1.-3.*o,0.,1.);}
float shadow(vec3 ro,vec3 rd){float r=1.,t=.02;for(int i=0;i<48;i++){float h=map(ro+rd*t).x;if(h<.001)return 0.;r=min(r,8.*h/t);t+=clamp(h,.01,.2);if(t>4.)break;}return clamp(r,0.,1.);}
vec3 albedo(float m,vec3 p){
 if(m<1.5){float a=atan(p.z,p.x);float s=O==0?step(.5,fract(a*8./(2.*PI))):step(.5,fract(p.y*5.5+.2));vec3 w=O==0?vec3(.55,.24,.11):vec3(.78,.5,.26);return w*(1.+.12*s-.07*sin(p.y*55.+sin(p.x*9.)*3.));}

 if(m<3.5)return vec3(.05,.55,.55);
 if(m<4.5)return vec3(.82,.5,.1);

 if(m<6.5)return vec3(.86,.64,.33)*(1.-.18*step(.5,fract((p.x+p.y+p.z)*14.)));
 if(m<7.5){float w=step(.5,fract(p.y*9.))*step(.5,fract(atan(p.z,p.x)*4.))+step(.5,fract(p.y*9.+.5))*step(.5,fract(atan(p.z,p.x)*4.+.5));return vec3(.85,.6,.27)*(.82+.25*w);}

 if(m<11.5)return vec3(.45,.86,.8);

void main(){

function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))document.title='ERR '+gl.getShaderInfoLog(x);return x;}
