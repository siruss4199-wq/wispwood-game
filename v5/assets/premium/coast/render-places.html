<script>
// Stage dioramas for the beach places (build 38): workshop, pier, beacon, three stages each.
const OBJS=['workshop1','workshop2','workshop3','pier1','pier2','pier3','beacon1','beacon2','beacon3'];
const OBJ=new URLSearchParams(location.search).get('o')||'workshop1';
const gl=document.getElementById('c').getContext('webgl',{premultipliedAlpha:false,preserveDrawingBuffer:true,alpha:true});
const vs=`attribute vec2 p;void main(){gl_Position=vec4(p,0,1);}`;
const fs=`precision highp float;uniform vec2 R;uniform int O;
#define PI 3.14159265
float sdBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.)-r;}
float sdCyl(vec3 p,float r,float h,float rr){vec2 d=vec2(length(p.xz)-r,abs(p.y)-h)+rr;return min(max(d.x,d.y),0.)+length(max(d,0.))-rr;}
float sdCone(vec3 p,float r0,float r1,float h){float k=mix(r0,r1,clamp(p.y/(2.*h)+.5,0.,1.));vec2 d=vec2(length(p.xz)-k,abs(p.y)-h);return min(max(d.x*.9,d.y),0.)+length(max(d,0.));}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdSph(vec3 p,float r){return length(p)-r;}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);return length(pa-ba*h)-r;}
float sdOct(vec3 p,float s){p=abs(p);return (p.x+p.y+p.z-s)*.57735;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec2 U(vec2 a,float d,float m){return d<a.x?vec2(d,m):a;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
// a teardrop flame standing at the origin, height ~h
float flame(vec3 f,float w,float h){float y=clamp(f.y/h,0.,1.);float rr=w*(1.-y)*(.6+.8*sqrt(max(y,0.)))*1.3;float d=max(length(f.xz)-rr,abs(f.y-h*.5)-h*.5);d=smin(d,sdSph(f-vec3(0,w*.6,0),w*.85),w*.5);return d*.8+.006*sin(f.y*60.+f.x*30.);}
// materials: 1 planks 2 iron 3 teal paint 4 brass 5 roof tiles 6 rope 7 stone 8 dark wood 9 sand
// 10 flame (glows) 11 seaglass (glows a little) 12 canvas 13 white 14 lit window 15 red paint
vec2 workshop(vec3 p,int S){
 vec2 r=vec2(1e9,0.);
 r=U(r,sdBox(p-vec3(0,-.52,0),vec3(.5,.05,.36),.02),7.);
 r=U(r,sdBox(p-vec3(0,-.25,0),vec3(.4,.23,.28),.015),1.);
 vec3 q=p-vec3(0,-.02,0);
 vec3 a=q;a.z=abs(a.z);a-=vec3(0,.12,.15);a.yz*=rot(-.62);r=U(r,sdBox(a,vec3(.47,.025,.21),.01),5.);
 float gable=max(max(abs(q.x)-.395,q.y-.24),dot(vec2(abs(q.z),q.y),normalize(vec2(.62,.79)))-.17);gable=max(gable,-q.y-.01);r=U(r,gable,1.);
 r=U(r,sdBox(p-vec3(-.15,-.33,.285),vec3(.085,.15,.012),.01),8.);
 r=U(r,sdSph(p-vec3(-.09,-.33,.3),.012),4.);
 r=U(r,sdBox(p-vec3(.16,-.2,.285),vec3(.08,.065,.008),.004),14.);
 r=U(r,sdBox(p-vec3(.16,-.2,.288),vec3(.095,.08,.004),.003),4.);
 r=U(r,sdBox(p-vec3(.16,-.2,.29),vec3(.006,.08,.006),.0),4.);
 if(S>=2){
  r=U(r,sdBox(p-vec3(.24,.22,-.1),vec3(.075,.24,.075),.015),7.);
  r=U(r,sdBox(p-vec3(.24,.47,-.1),vec3(.09,.02,.09),.01),2.);
  r=U(r,flame(p-vec3(.24,.48,-.1),.045,.12),10.);
  {float sm=smin(smin(sdSph(p-vec3(.21,.66,-.1),.045),sdSph(p-vec3(.16,.73,-.1),.055),.04),sdSph(p-vec3(.09,.79,-.1),.06),.05);sm+=.008*sin(p.x*50.)*sin(p.y*47.);r=U(r,sm,16.);}
  vec3 an=p-vec3(-.5,-.38,.3);r=U(r,sdBox(an,vec3(.09,.035,.05),.01),2.);r=U(r,sdBox(an+vec3(0,.06,0),vec3(.035,.04,.035),.005),2.);r=U(r,sdBox(an+vec3(0,.12,0),vec3(.07,.02,.05),.01),8.);
  r=U(r,sdCapsule(an,vec3(.12,.04,0),vec3(.2,.02,0),.012),2.);
 }
 if(S>=3){
  r=U(r,sdBox(p-vec3(.58,-.33,.02),vec3(.15,.15,.24),.015),3.);
  vec3 aw=p-vec3(.58,-.12,.08);aw.xy*=rot(-.35);r=U(r,sdBox(aw,vec3(.2,.015,.3),.01),12.);
  r=U(r,sdBox(p-vec3(.58,-.33,.26),vec3(.11,.11,.006),.0),8.);
  for(int i=0;i<2;i++){float y=-.39+float(i)*.1;r=U(r,sdBox(p-vec3(.58,y,.26),vec3(.11,.006,.03),.002),1.);}
  r=U(r,sdBox(p-vec3(.47,-.44,.4),vec3(.07,.07,.07),.01),1.);r=U(r,sdBox(p-vec3(.62,-.46,.42),vec3(.05,.05,.05),.01),3.);
  r=U(r,sdBox(p-vec3(0,.1,.31),vec3(.13,.045,.012),.01),4.);
 }
 return r;
}
vec2 pier(vec3 p,int S){
 vec2 r=vec2(1e9,0.);
 r=U(r,sdBox(p-vec3(-.55,-.53,-.05),vec3(.22,.05,.32),.06),9.);
 vec3 d=p-vec3(.05,-.34,0);
 float deck=sdBox(d,vec3(.6,.025,.17),.008);deck+=.004*smoothstep(.8,1.,abs(sin(d.x*28.)));r=U(r,deck,1.);
 for(int i=0;i<4;i++){float x=-.35+float(i)*.3;for(int k=0;k<2;k++){float z=k==0?-.15:.15;r=U(r,sdCyl(p-vec3(.05+x,-.5,z),.03,.17,.01),8.);}}
 for(int k=0;k<2;k++){float z=k==0?-.17:.17;r=U(r,sdBox(p-vec3(.05,-.27,z),vec3(.6,.008,.008),.004),6.);for(int i=0;i<5;i++){float x=-.5+float(i)*.25;r=U(r,sdCyl(p-vec3(.05+x,-.29,z),.012,.05,.004),8.);}}
 r=U(r,sdCyl(p-vec3(.58,-.27,.12),.025,.05,.01),2.);
 if(S>=2){
  vec3 c=p-vec3(.45,0.,-.08);
  r=U(r,sdBox(c-vec3(0,-.27,0),vec3(.07,.04,.07),.01),3.);
  r=U(r,sdBox(c-vec3(0,0.,0),vec3(.025,.28,.025),.008),8.);
  vec3 jib=c-vec3(-.18,.24,0);jib.xy*=rot(-.25);r=U(r,sdBox(jib,vec3(.26,.02,.02),.006),8.);
  r=U(r,sdCapsule(c,vec3(0,.12,0),vec3(-.22,.26,0),.008),6.);
  r=U(r,sdCapsule(c,vec3(-.42,.3,0),vec3(-.42,.0,0),.006),6.);
  r=U(r,sdTorus((c-vec3(-.42,-.03,0)).xzy,vec2(.025,.008)),2.);
  r=U(r,sdBox(c-vec3(-.42,-.1,0),vec3(.05,.05,.05),.008),1.);
  r=U(r,sdCyl((c-vec3(.0,.06,.04)).xzy,.04,.02,.005),4.);
 }
 if(S>=3){
  vec3 b=p-vec3(.08,-.47,.4);
  vec3 e=b/vec3(.36,.13,.12);float hull=(length(e)-1.)*.11;hull=max(hull,b.y-.05);float inner=(length((b-vec3(0,.02,0))/vec3(.32,.12,.095))-1.)*.09;hull=max(hull,-inner);
  r=U(r,hull,b.y>-.035?13.:3.);
  r=U(r,max((length(e*vec3(1.,1.,1.))-1.02)*.11,abs(b.y-.035)-.012),15.);
  r=U(r,sdBox(b-vec3(.02,.0,0),vec3(.2,.008,.07),.004),1.);
  r=U(r,sdCyl(b-vec3(.03,.27,0),.011,.26,.004),8.);
  vec3 sl=b-vec3(-.07,.29,0);r=U(r,max(max(sdBox(sl,vec3(.1,.2,.004),.0),-(sl.x+.1)*0.+dot(sl.xy,normalize(vec2(1.,.5)))-.045),-sl.y-.2),12.);
  r=U(r,sdCapsule(p,vec3(-.05,-.31,.17),vec3(.0,-.42,.3),.006),6.);
 }
 return r;
}
vec2 beacon(vec3 p,int S){
 vec2 r=vec2(1e9,0.);
 r=U(r,sdCyl(p-vec3(0,-.53,0),.34,.05,.04),7.);
 vec3 t=p-vec3(0,-.2,0);float tower=sdCone(t,.22,.15,.3);tower+=.006*smoothstep(.85,1.,abs(sin(t.y*22.)));r=U(r,tower,7.);
 r=U(r,sdBox(p-vec3(0,-.33,.2),vec3(.06,.1,.03),.01),8.);
 r=U(r,sdCone(p-vec3(0,-.05,0),.207,.19,.06)-.008,15.);
 r=U(r,sdCyl(p-vec3(0,.12,0),.2,.025,.01),2.);
 vec3 bs=p-vec3(0,.2,0);float basket=max(sdCyl(bs,.14,.07,.01),-sdCyl(bs-vec3(0,.05,0),.11,.07,.0));r=U(r,basket,2.);
 r=U(r,flame(p-vec3(0,.22,0),.1,.3),10.);
 if(S>=2){
  for(int i=0;i<3;i++){float a=float(i)*2.094+.9;vec3 c=vec3(.25*cos(a),.3,.25*sin(a));vec3 m=p-c;m.xz=rot(-a)*m.xz;m.xy*=rot(-.2);
   r=U(r,sdTorus(m.yxz,vec2(.085,.014)),4.);r=U(r,sdCyl(m.yxz,.08,.006,.0),13.);
   r=U(r,sdCapsule(p,vec3(.15*cos(a),.24,.15*sin(a)),c-vec3(0,.03,0)-vec3(cos(a),0.,sin(a))*.05,.01),2.);}
 }
 if(S>=3){
  r=U(r,sdTorus(p-vec3(0,.48,0),vec2(.13,.02)),4.);
  for(int i=0;i<5;i++){float a=float(i)*1.2566;vec3 c=p-vec3(.13*cos(a),.56,.13*sin(a));c.xz*=rot(a);r=U(r,sdOct(c*vec3(1.,.55,1.),.05),11.);}
  r=U(r,sdOct((p-vec3(0,.66,0))*vec3(1.,.5,1.),.06),11.);
 }
 return r;
}
vec2 map(vec3 p){
 int S=int(mod(float(O),3.))+1;
 if(O<3)return workshop(p,S);
 if(O<6)return pier(p,S);
 return beacon(p,S);
}
vec3 nor(vec3 p){vec2 e=vec2(.0012,0);return normalize(vec3(map(p+e.xyy).x-map(p-e.xyy).x,map(p+e.yxy).x-map(p-e.yxy).x,map(p+e.yyx).x-map(p-e.yyx).x));}
float ao(vec3 p,vec3 n){float o=0.,s=1.;for(int i=1;i<6;i++){float h=.02*float(i);o+=(h-map(p+n*h).x)*s;s*=.7;}return clamp(1.-3.*o,0.,1.);}
float shadow(vec3 ro,vec3 rd){float r=1.,t=.02;for(int i=0;i<56;i++){float h=map(ro+rd*t).x;if(h<.001)return 0.;r=min(r,8.*h/t);t+=clamp(h,.008,.15);if(t>4.)break;}return clamp(r,0.,1.);}
vec3 albedo(float m,vec3 p){
 if(m<1.5)return vec3(.74,.48,.26)*(1.+.1*step(.5,fract(p.y*14.))-.06*sin(p.x*70.+sin(p.y*9.)*3.));
 if(m<2.5)return vec3(.3,.33,.38);
 if(m<3.5)return vec3(.05,.55,.56);
 if(m<4.5)return vec3(.85,.56,.14);
 if(m<5.5)return vec3(.86,.36,.2)*(1.-.14*step(.5,fract(p.x*16.+step(.5,fract(p.y*18.))*.5)));
 if(m<6.5)return vec3(.86,.66,.36)*(1.-.15*step(.5,fract((p.x+p.y+p.z)*30.)));
 if(m<7.5){float b=step(.5,fract(p.y*9.))*.5;return vec3(.7,.68,.64)*(1.-.08*step(.92,fract(p.y*9.))-.08*step(.94,fract(atan(p.z,p.x)*3.+p.x*4.+b)));}
 if(m<8.5)return vec3(.42,.26,.14);
 if(m<9.5)return vec3(.93,.82,.6);
 if(m<10.5){float y=O<3?(p.y-.48)/.14:(p.y-.22)/.32;return mix(vec3(1.,.32,.04),vec3(1.,.86,.36),pow(clamp(y,0.,1.),.8));}
 if(m<11.5)return vec3(.45,.9,.84);
 if(m<12.5)return vec3(.95,.92,.82)*(1.-.12*step(.5,fract(p.x*7.)));
 if(m<13.5)return vec3(.92,.95,.98);
 if(m<14.5)return vec3(1.,.82,.45);
 if(m<15.5)return vec3(.82,.18,.16);
 return vec3(.66,.69,.75);
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
 float yaw=.55,pitch=.4,dist=O<3?3.9:3.5;
 vec3 ro=vec3(dist*sin(yaw)*cos(pitch),dist*sin(pitch),dist*cos(yaw)*cos(pitch));
 vec3 ta=O<3?vec3(.12,.06,0):vec3(0,-.06,0),ww=normalize(ta-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+1.8*ww);
 float t=0.;vec2 h;bool hit=false;
 for(int i=0;i<220;i++){h=map(ro+rd*t);if(h.x<.0005){hit=true;break;}t+=h.x*.85;if(t>7.)break;}
 float groundY=-.58;
 vec3 L=normalize(vec3(-.6,.85,.45));
 if(!hit){
  float tg=(groundY-ro.y)/rd.y;if(tg>0.){vec3 g=ro+rd*tg;float sh=1.-shadow(g+vec3(0,.002,0),L);float d=length(g.xz*vec2(.75,1.));float a=.3*smoothstep(.95,.3,d)+.35*sh*smoothstep(1.3,.3,d);gl_FragColor=vec4(.08,.13,.2,clamp(a,0.,.6));return;}
  gl_FragColor=vec4(0);return;}
 vec3 p=ro+rd*t,n=nor(p),col=albedo(h.y,p);float m=h.y;
 if(m>9.5&&m<10.5||m>13.5&&m<14.5){gl_FragColor=vec4(clamp(m<10.5?col*(.92+.18*n.y):pow(col*(1.1+.2*n.y),vec3(.4545)),0.,1.),1.);return;}
 bool metal=m>1.5&&m<2.5||m>3.5&&m<4.5;bool gloss=metal||m>2.5&&m<3.5||m>10.5&&m<11.5||m>12.5&&m<13.5||m>14.5;
 float dif=clamp(dot(n,L),0.,1.)*shadow(p+n*.003,L);
 float occ=ao(p,n);float sky=clamp(.5+.5*n.y,0.,1.);float bounce=clamp(.5-.5*n.y,0.,1.);
 vec3 hv=normalize(L-rd);
 float spec=pow(clamp(dot(n,hv),0.,1.),metal?60.:gloss?30.:12.)*(metal?1.6:gloss?.7:.15)*dif;
 float rim=pow(1.-clamp(dot(n,-rd),0.,1.),2.5);
 vec3 lin=vec3(1.05,.97,.88)*dif*1.15+vec3(.45,.55,.7)*sky*.45*occ+vec3(.6,.45,.3)*bounce*.18*occ;
 if(metal)lin=lin*.85+vec3(.16)*sky*occ;
 // warm light from the fire / windows nearby
 vec3 fire=O<3?vec3(.24,.52,-.1):O>=6?vec3(0,.32,0):vec3(9.);float fd=length(p-fire);lin+=vec3(1.,.55,.2)*.35*clamp(dot(n,normalize(fire-p)),0.,1.)/(1.+fd*fd*12.)*(O<3?float(O>=1):1.);
 col=col*lin+spec*vec3(1.,.96,.88);
 if(m>10.5&&m<11.5)col+=vec3(.12,.3,.28);
 col+=rim*vec3(.55,.75,.95)*.2*occ*clamp(dot(n,normalize(vec3(.7,.3,-.5)))+.4,0.,1.);
 col*=mix(1.,.65,pow(rim,1.6));
 col=pow(col,vec3(.4545));col=mix(vec3(dot(col,vec3(.33))),col,1.18);col=(col-.5)*1.08+.52;
 gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))document.title='ERR '+gl.getShaderInfoLog(x);return x;}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const l=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
gl.uniform2f(gl.getUniformLocation(pr,'R'),512,512);gl.uniform1i(gl.getUniformLocation(pr,'O'),OBJS.indexOf(OBJ));
gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
if(!document.title.startsWith('ERR'))document.title='done';
</script></body></html>
