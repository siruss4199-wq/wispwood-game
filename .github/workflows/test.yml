name: Wispwood game tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev/v5-premium-restoration, codex/v5-first-session-foundation, codex/v5-three-seal-foundation, codex/v5-critical-path-challenge, codex/v5-request-loop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Game rule and markup tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run legacy prototype tests
        run: node --test tests/game.test.cjs
      - name: Run clean V2 core tests
        run: node --test tests/v2-core.test.mjs
      - name: Check V2 UI module syntax
        run: node --check v2/app.mjs
      - name: Run V3 core tests
        run: node --test tests/v3-core.test.mjs
      - name: Check V3 UI module syntax
        run: node --check v3/app.mjs
      - name: Run V4 core tests
        run: node --test tests/v4-core.test.mjs tests/v45-core.test.mjs tests/v46-core.test.mjs
      - name: Run V4 simulation
        run: node --test tests/v4-simulation.test.mjs
      - name: Check V4 UI module syntax
        run: node --check v4/app.mjs
      - name: Check CrazyGames platform adapter
        run: node --check v4/platform.mjs
      - name: Run CrazyGames readiness checks
        run: node --test tests/v4-crazygames.test.mjs

      - name: Run V5 rules and first-session simulation
        run: |
          node --test tests/v5-*.test.mjs
          mkdir -p test-artifacts/v5
          node tests/v5-seal-metrics.mjs > test-artifacts/v5/seal-policy-metrics.json
          node tests/v5-resonance-metrics.mjs > test-artifacts/v5/resonance-policy-metrics.json
      - name: Check V5 modules
        run: node --check v5/app.mjs && node --check v5/core.mjs && node --check v5/art.mjs
      - name: Install browser smoke dependencies
        run: npm install --no-save playwright@1.62.1 && npx playwright install --with-deps chromium webkit
      - name: Verify mobile render, persistence and board interactions
        run: |
          python3 -m http.server 8080 > /tmp/wispwood-http.log 2>&1 &
          git fetch --depth=1 origin 847bb89263f27d8763d233ce8ea9f838bdb3a8a7
          mkdir -p /tmp/vaultwake-before
          git archive FETCH_HEAD | tar -x -C /tmp/vaultwake-before
          python3 -m http.server 8081 --directory /tmp/vaultwake-before > /tmp/vaultwake-before-http.log 2>&1 &
          node tests/v5-route-clarity-browser.cjs
          node tests/v5-workshop-evolution-browser.cjs
          node tests/v5-workshop-browser.cjs
          node tests/v5-requests-browser.cjs
          git fetch --depth=1 origin d16d4921b52f4a93bd929486e9d919228c5192c9
          mkdir -p /tmp/vaultwake-stage2-before
          git archive FETCH_HEAD | tar -x -C /tmp/vaultwake-stage2-before
          python3 -m http.server 8082 --directory /tmp/vaultwake-stage2-before > /tmp/vaultwake-stage2-before.log 2>&1 &
          node tests/v5-resonance-browser.cjs
          node tests/v45-browser.cjs
          node tests/v5-browser.cjs
          node tests/v5-mobile.cjs
      - name: Save mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-expedition-review
          path: test-artifacts/
