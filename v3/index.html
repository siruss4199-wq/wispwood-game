<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wispwood V3</title><link rel="stylesheet" href="./style.css"></head><body>
<main class="shell">
<header><div><small>WISPWOOOD V3</small><h1>Lost Clearing</h1></div><div class="wallet"><span>⚡ <b id="energy"></b></span><span>🪙 <b id="coins"></b></span><span>✨ <b id="light"></b></span></div></header>
<section class="goal"><div><small>RESTORATION</small><strong id="goalTitle"></strong><p id="goalText"></p></div><b id="goalProgress"></b></section>
<section id="orders" class="orders"></section>

</main><div id="toast" class="toast"></div><script type="module" src="./app.mjs"></script></body></html>
