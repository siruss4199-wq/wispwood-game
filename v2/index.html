<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef5e9"><title>Wispwood V2</title>
<link rel="stylesheet" href="./style.css"></head><body>
<main class="game-shell">
<header class="topbar">
 <div><small>WISPWOOOD V2</small><h1>Lost Clearing</h1></div>
 <div class="resources"><span>⚡ <b id="energy">20/20</b></span><span>🪙 <b id="coins">0</b></span><span>✨ <b id="light">0</b></span></div>
</header>

<section class="restoration-card">
 <div class="restoration-head"><div><small id="areaLabel">LOST CLEARING · 0% RESTORED</small><strong id="projectTitle">Wake the Garden</strong></div><b id="projectStep">1/4</b></div>
 <div class="restoration-visual" id="restorationVisual"></div>
 <div class="progress-track"><div id="areaProgress"></div></div>
 <p id="projectText">Earn Coins and Forest Light, then spend them with the required item.</p>
 <div class="costs"><span id="coinCost">🪙 0/40</span><span id="lightCost">✨ 0/3</span><span id="itemCost">🌿 Herb</span></div>
 <button id="restoreBtn" disabled>Restore project</button>
</section>

<section class="quest-card"><span>📜</span><div><small>FOREST ORDER</small><strong id="questTitle">Herb Request</strong><p id="questText">Prepare an Herb for a wounded forest spirit.</p></div><b id="questReward">+25 🪙</b></section>

<div class="board-wrap"><div id="board" class="board" role="grid" aria-label="8 by 8 merge board"></div></div>
<div class="actions"><button id="deliverBtn" disabled>♡ Deliver order</button><button id="recycleBtn" disabled>♻ Recycle</button></div>
<p id="hint" class="hint">Drag the two matching Seeds together.</p>
</main><div id="toast" class="toast" role="status"></div>
<script type="module" src="./app.mjs"></script></body></html>
